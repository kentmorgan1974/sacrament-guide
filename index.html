<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sacrament Guide</title>
<meta name="theme-color" content="#1f4e8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sacrament Guide">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#d8dce3;--acc:#1f4e8c;--accbg:#e8f0fb;--warn:#fff6e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Segoe UI",Arial,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header.top h1{font-size:17px;margin:0 12px 0 0}
.tabs button{border:0;background:none;padding:8px 12px;font-size:15px;cursor:pointer;border-radius:6px;color:var(--mute)}
.tabs button.on{background:var(--accbg);color:var(--acc);font-weight:600}
.spacer{flex:1}
button.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:14px}
button.btn:hover{background:#f0f2f5}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.pri:hover{background:#17407a}
button.sm{padding:3px 8px;font-size:13px}
button.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:15px;padding:2px 6px}
button.x:hover{color:#b00020}
.wrap{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
.wrap.one{grid-template-columns:minmax(0,900px);justify-content:center}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);margin:0 0 8px}
.field{display:flex;align-items:center;gap:6px;margin:5px 0}
.field>label{width:128px;flex:none;font-size:13px;color:var(--mute)}
.field>.in{flex:1;display:flex;gap:6px;align-items:center;min-width:0}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:inherit;background:#fff}
textarea{resize:vertical;min-height:54px}
input:focus,select:focus,textarea:focus{outline:2px solid #9bbcf0;border-color:var(--acc)}
.row{display:flex;gap:6px;align-items:center;margin:4px 0}
.row>*{flex:1}.row>.fixed{flex:none}.row>.n{flex:0 0 76px}
.hint{font-size:12px;color:var(--mute);margin:2px 0 6px}
.banner{background:var(--warn);border:1px solid #f0d58a;border-radius:6px;padding:8px 10px;margin-bottom:12px;font-size:13px;display:flex;gap:8px;align-items:center}
.banner.err{background:#fde8e8;border-color:#f3b5b5}
.item{border:1px solid var(--line);border-radius:6px;padding:8px;margin:6px 0;background:#fafbfc}
.item .hd{display:flex;gap:4px;align-items:center;margin-bottom:4px;font-weight:600;font-size:13px}
.paste{border:2px dashed var(--line);border-radius:6px;padding:10px;text-align:center;color:var(--mute);margin:6px 0;cursor:text}
.paste:focus{outline:2px solid #9bbcf0;border-color:var(--acc)}
.paste img{max-width:100%;display:block;margin:6px auto}
.preview{position:sticky;top:58px;height:calc(100vh - 74px)}
.preview iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
table.hist{width:100%;border-collapse:collapse}
table.hist td,table.hist th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.cb{display:flex;gap:6px;align-items:center;font-size:14px}
.cb input{width:auto}
.grid3{display:grid;grid-template-columns:90px 1fr 1fr 30px;gap:6px;margin:4px 0}
.small{font-size:12px;color:var(--mute)}

.person{margin:0}.person select.ttl{flex:0 0 104px;width:104px}
.timepick{display:flex;gap:3px;align-items:center;flex:1}.timepick select{padding:6px 2px}

/* ---- phones and small tablets ---- */
.seg{display:none}
@media(max-width:800px){
  body{font-size:16px;padding-bottom:76px}
  header.top{padding:8px 10px;gap:4px}
  header.top h1{font-size:16px;margin:0 6px 0 0}
  .tabs button{padding:10px 12px}
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  .actions .btn{flex:1 1 0;min-height:44px;padding:6px 4px;font-size:14px}
  .wrap{padding:8px;gap:8px}
  .card{padding:10px}
  .seg{display:flex;gap:6px;padding:8px 8px 0}
  .seg button{flex:1;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:15px}
  .seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .wrap[data-view=form] .preview{display:none}
  .wrap[data-view=preview] .formcol{display:none}
  .preview{position:static;height:calc(100vh - 190px);min-height:420px}
  input[type=text],input[type=date],input[type=number],input[type=time],select,textarea{font-size:16px;min-height:44px;padding:8px 10px}
  textarea{min-height:64px}
  button.btn{min-height:44px;font-size:15px}button.sm{min-height:40px;padding:6px 12px}
  button.x{min-width:40px;min-height:40px;font-size:18px}
  .cb input{width:22px;height:22px}.cb{font-size:16px;min-height:36px}
  .field{flex-direction:column;align-items:stretch;gap:2px;margin:8px 0}
  .field>label{width:auto!important}
  .field>.in{width:100%}
  .row{flex-wrap:wrap}.row>*{min-width:110px}.row>.fixed{min-width:0}.row>.n{flex:0 0 96px;min-width:96px}
  .person{flex-direction:column;align-items:stretch;flex-wrap:nowrap}.person>*{min-width:0}
  .person select.ttl{flex:none;width:100%}
  .timepick select{padding:8px 2px;min-width:0}
  .grid3{grid-template-columns:1fr}
  .item{padding:10px}
  .banner{flex-wrap:wrap}
}
.scrollx{overflow-x:auto}
</style>

<script>var SG_PUBLIC=true;</script>
<script>/* Sacrament Guide core: week data + settings -> semantic blocks -> .docx bytes / preview HTML.
   Pure JavaScript, no DOM, so the same code runs in the browser and in the command-line test harness. */
var SG = (function () {
'use strict';

/* ---------- small utilities ---------- */
var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MONTHS = ['Jan', 'Feb', 'March', 'April', 'May', 'June', 'July', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'];
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function trim(s) { return (s == null ? '' : String(s)).replace(/^\s+|\s+$/g, ''); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function b64decode(s) {
  s = s.replace(/[^A-Za-z0-9+\/]/g, '');
  var out = new Uint8Array(Math.floor(s.length * 3 / 4)), n = 0, i, a, b, c, d;
  for (i = 0; i < s.length; i += 4) {
    a = B64.indexOf(s.charAt(i)); b = B64.indexOf(s.charAt(i + 1));
    c = i + 2 < s.length ? B64.indexOf(s.charAt(i + 2)) : -1; d = i + 3 < s.length ? B64.indexOf(s.charAt(i + 3)) : -1;
    out[n++] = (a << 2) | (b >> 4);
    if (c >= 0) out[n++] = ((b & 15) << 4) | (c >> 2);
    if (d >= 0) out[n++] = ((c & 3) << 6) | d;
  }
  return out.subarray(0, n);
}
function b64encode(u8) {
  var out = [], i, a, b, c;
  for (i = 0; i < u8.length; i += 3) {
    a = u8[i]; b = i + 1 < u8.length ? u8[i + 1] : 0; c = i + 2 < u8.length ? u8[i + 2] : 0;
    out.push(B64.charAt(a >> 2) + B64.charAt(((a & 3) << 4) | (b >> 4)) +
      (i + 1 < u8.length ? B64.charAt(((b & 15) << 2) | (c >> 6)) : '=') + (i + 2 < u8.length ? B64.charAt(c & 63) : '='));
  }
  return out.join('');
}
function utf8(str) {
  var out = [], i, c, d;
  for (i = 0; i < str.length; i++) {
    c = str.charCodeAt(i);
    if (c >= 0xD800 && c < 0xDC00 && i + 1 < str.length) { d = str.charCodeAt(i + 1); if (d >= 0xDC00 && d < 0xE000) { c = 0x10000 + ((c - 0xD800) << 10) + (d - 0xDC00); i++; } }
    if (c < 0x80) out.push(c);
    else if (c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 63));
    else if (c < 0x10000) out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    else out.push(0xF0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return new Uint8Array(out);
}

/* ---------- minimal ZIP writer (stored, no compression) ---------- */
var CRC_T = (function () { var t = [], n, k, c; for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { var c = 0xFFFFFFFF, i; for (i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files) { // files: [{name, data:Uint8Array}]
  var parts = [], central = [], offset = 0, total = 0, i, f, name, crc, h, dv, cd;
  for (i = 0; i < files.length; i++) {
    f = files[i]; name = utf8(f.name); crc = crc32(f.data);
    h = new Uint8Array(30 + name.length); dv = new DataView(h.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true); dv.setUint16(12, 0x21, true); dv.setUint32(14, crc, true); dv.setUint32(18, f.data.length, true);
    dv.setUint32(22, f.data.length, true); dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true); h.set(name, 30);
    parts.push(h, f.data);
    cd = new Uint8Array(46 + name.length); dv = new DataView(cd.buffer);
    dv.setUint32(0, 0x02014b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 20, true); dv.setUint16(8, 0, true); dv.setUint16(10, 0, true);
    dv.setUint16(12, 0, true); dv.setUint16(14, 0x21, true); dv.setUint32(16, crc, true); dv.setUint32(20, f.data.length, true);
    dv.setUint32(24, f.data.length, true); dv.setUint16(28, name.length, true); dv.setUint32(42, offset, true); cd.set(name, 46);
    central.push(cd); offset += h.length + f.data.length;
  }
  var cdSize = 0; for (i = 0; i < central.length; i++) cdSize += central[i].length;
  var end = new Uint8Array(22); dv = new DataView(end.buffer);
  dv.setUint32(0, 0x06054b50, true); dv.setUint16(8, files.length, true); dv.setUint16(10, files.length, true);
  dv.setUint32(12, cdSize, true); dv.setUint32(16, offset, true);
  var all = parts.concat(central, [end]); for (i = 0; i < all.length; i++) total += all[i].length;
  var out = new Uint8Array(total), p = 0; for (i = 0; i < all.length; i++) { out.set(all[i], p); p += all[i].length; }
  return out;
}

/* ---------- defaults ---------- */
var PUBLIC = typeof SG_PUBLIC !== 'undefined' && !!SG_PUBLIC; // the shared web build ships with no names in it
var PEOPLE = {ward: 'Your Ward', bishopric: [{title: 'Bishop', name: '', role: ''}, {title: 'Brother', name: '', role: '1st Counselor'}, {title: 'Brother', name: '', role: '2nd Counselor'}],
  stakePresidency: [{title: 'President', name: '', role: 'Stake President'}, {title: 'President', name: '', role: '1st Counselor'}, {title: 'President', name: '', role: '2nd Counselor'}],
  organist: {title: 'Sister', name: ''}, chorister: {title: 'Sister', name: ''}};/*PEOPLE-END*/
function defaults() {
  return {
    version: 1,
    ward: PEOPLE.ward,
    headerTitle: 'Sacrament Meeting Guide',
    bishopric: clone(PEOPLE.bishopric),
    stakePresidency: clone(PEOPLE.stakePresidency),
    organist: clone(PEOPLE.organist),
    chorister: clone(PEOPLE.chorister),
    text: {
      banner: '“WELCOME TO VISITORS AND MEMBERS”',
      visitingHeading: 'ACKNOWLEDGE VISITING AUTHORIES/SPEAKERS',
      stakeHeading: 'Stake Presidency/High Counselor:',
      highCounselor: 'High Counselor (e.g., Brother ???)',
      announceHdr1: 'Date｜Time｜Place',
      announceHdr2: 'Announcement',
      announceNote: 'NOTE: Please refer to announcements in the program for other events',
      wardBusiness: 'BUSINESS',
      newMembers: 'NEW MEMBERS: Read in new member records ({{if applicable}}).',
      releasesHeading: 'WARD RELEASES:',
      releasesIntro: '“We have released ([[name]]) as ([[position]]) and propose that he/she be given a vote of thanks and appreciation. Those who desire to join us in expressing our appreciation may do so by the uplifted hand.”',
      releasesFoot: 'Can be done together',
      sustainHeading: 'WARD SUSTAINING:',
      sustainIntro: '“I’d like to ask ([[name]]) to stand. It is proposed that we sustain ([[Read names and positions or Priesthood]]). Those in favor manifest it by the uplifted hand. ([[Wait for vote]]). Those opposed, if any, by the same sign.” ([[Wait for vote]])',
      sustainFoot: 'Some can be done together',
      stakeBusiness: 'STAKE BUSINESS ({{if applicable}}):',
      stakeBusinessItem: 'Turn time over to Stake leadership.',
      otherBusiness: 'Other Ward Business: (Confirmation, baby blessings, etc.)',
      sacrament: 'SACRAMENT:',
      sacramentPassed: '“The Sacrament will then be passed under the direction of our Priesthood Brethren.”',
      afterSacramentLabel: '(After Sacrament)',
      afterSacramentText: '“Thank the Members of the Aaronic & Melchizedek Priesthood and invite them to sit with their families…”',
      program: 'MAIN PROGRAM',
      notes: 'Special Notes / Observations / Attendance',
      blankPrayer: 'By Invitation'
    },
    pageBreaks: true,
    releaseRows: 4,
    hymns: [],
    hymnsVersion: 2
  };
}

function newWeek(dateStr) {
  return {
    date: dateStr || '', presiding: 'b0', presidingOther: '', conducting: 'b0', welcoming: '', welcomingOther: '',
    status: {}, chorister: '', organist: '', highCounselor: '', visitors: '',
    announcements: [{ date: '', time: '', time2: '', place: '', c1: '', c2: '' }],
    hymns: { opening: { n: '', t: '' }, sacrament: { n: '', t: '' }, closing: { n: '', t: '' } },
    prayers: { opening: '', closing: '' },
    newMembers: { text: '', image: null },
    releases: [], sustainings: [],
    stakeBusiness: true, baby: false, confirmation: false, otherBusiness: '',
    program: [], sundayType: '', notes: ''
  };
}

/* ---------- people / names ---------- */
function ordinalRuns(text, fmt) { // 1st -> 1 + superscript st
  var out = [], re = /(\d+)(st|nd|rd|th)\b/g, last = 0, m, f;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(R(text.substring(last, m.index), fmt));
    out.push(R(m[1], fmt)); f = clone(fmt || {}); f.sup = true; out.push(R(m[2], f)); last = re.lastIndex;
  }
  if (last < text.length) out.push(R(text.substring(last), fmt));
  return out;
}
function fullName(p) { return trim(p.name) ? trim(trim(p.title) + ' ' + trim(p.name)) : ''; } // no name set = nobody (nothing prints)
function label(p) { return fullName(p) || trim(trim(p.title) + (trim(p.role) ? ' (' + trim(p.role) + ')' : '') + ' (name not set)'); }
function withRole(p) { var r = trim(p.role); return fullName(p) + (r ? ' (' + r + ')' : ''); }
function peopleIndex(S) { // ids used by the form: b0.., s0..
  var idx = {}, i;
  for (i = 0; i < S.bishopric.length; i++) idx['b' + i] = S.bishopric[i];
  for (i = 0; i < S.stakePresidency.length; i++) idx['s' + i] = S.stakePresidency[i];
  return idx;
}
function whoText(key, other, S) {
  if (key === 'other') return trim(other);
  var p = peopleIndex(S)[key]; return p ? fullName(p) : '';
}

/* ---------- block model ---------- */
function R(t, f) { var r = { t: t }; if (f) for (var k in f) r[k] = f[k]; return r; }
function P(runs, o) { o = o || {}; o.k = 'p'; o.runs = runs || []; return o; }
function blank(o) { return P([], o); }
var TAB = '\t', COL = 2880; // every "Label:  value" line lines up its value at one 2-inch tab stop

function markup(text, base) { // [[x]] = bold green, {{x}} = bold italic purple
  var out = [], re = /\[\[(.*?)\]\]|\{\{(.*?)\}\}/g, last = 0, m, f;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(R(text.substring(last, m.index), base));
    f = clone(base || {}); f.b = true;
    if (m[1] !== undefined) { f.color = '00B050'; out.push(R(m[1], f)); }
    else { f.color = '7030A0'; f.i = true; out.push(R(m[2], f)); }
    last = re.lastIndex;
  }
  if (last < text.length) out.push(R(text.substring(last), base));
  return out;
}

function parseDate(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; }
function dateLabel(s) { var d = parseDate(s); return d ? MONTHS[d.m - 1] + ' ' + d.d + ', ' + d.y : ''; }

function fmtTime(t) { // "18:30" -> {h:6, m:30, ap:'PM'}
  var m = /^(\d{1,2}):(\d{2})/.exec(t || ''); if (!m) return null;
  var hh = +m[1]; return { h: hh % 12 === 0 ? 12 : hh % 12, m: +m[2], ap: hh >= 12 ? 'PM' : 'AM' };
}
function timeStr(t, withAp) { return t.h + (t.m ? ':' + (t.m < 10 ? '0' : '') + t.m : '') + (withAp ? ' ' + t.ap : ''); }
function whenText(a) { // "Oct 18, 6-8 PM \u2013 Stake Center" from the calendar/clock fields, else the typed text
  var d = parseDate(a.date), t1 = fmtTime(a.time), t2 = fmtTime(a.time2), out = '', tt = '';
  if (d) out = WEEKDAYS[new Date(d.y, d.m - 1, d.d).getDay()] + ', ' + MONTHS[d.m - 1] + ' ' + d.d;
  if (t1 && t2) tt = t1.ap === t2.ap ? timeStr(t1, false) + '-' + timeStr(t2, true) : timeStr(t1, true) + '-' + timeStr(t2, true);
  else if (t1) tt = timeStr(t1, true);
  if (tt) out += (out ? ', ' : '') + tt;
  if (trim(a.place)) out += (out ? ' \u2013 ' : '') + trim(a.place);
  return out || trim(a.c1);
}

function hymnText(h) {
  var n = trim(h && h.n), t = trim(h && h.t);
  if (!n && !t) return '';
  return (n ? '#' + n : '') + (n && t ? ', ' : '') + (t ? '“' + t + '”' : '');
}

function buildBlocks(week, S) {
  var T = S.text, W = week, bl = [], idx = peopleIndex(S), i, j, p, txt;
  var conductText = whoText(W.conducting, '', S);
  var presText = whoText(W.presiding, W.presidingOther, S);

  bl.push(P([], { jc: 'center', markB: true }));
  bl.push(P([R(T.banner, { b: true })], { jc: 'center' }));
  bl.push(blank());
  var welcomeText = W.welcoming ? whoText(W.welcoming, W.welcomingOther, S) : conductText; // default: whoever is conducting
  if (welcomeText) { bl.push(P([R('WELCOME:', { b: true, u: true, sz: 28 }), R(TAB), R(welcomeText)], { tabPos: 2880 })); } // one tab to the same 2-inch column as the names below
  bl.push(blank());

  var LAB = { Presiding: [':', 2], Conducting: [': ', 1], Acknowledge: [':', 1], Excuse: [':', 2], Absent: [':', 2], Chorister: [': ', 2], Organist: [': ', 2] };
  function labelLine(label, runs, o) {
    var d = LAB[label], r = [R(label, { b: true }), R(d[0])], k;
    r.push(R(TAB));
    o = o || {}; o.tabPos = COL;
    return P(r.concat(runs), o);
  }
  var LP = { st: 'ListParagraph', num: [8, 0] };
  if (presText) bl.push(labelLine('Presiding', [R(presText)], clone(LP)));
  if (conductText) bl.push(labelLine('Conducting', [R(conductText)], clone(LP)));
  var groups = [], gmap = {};
  for (i = 0; i < S.bishopric.length; i++) {
    var id = 'b' + i, st = W.status && W.status[id];
    if (id === W.presiding || id === W.conducting || !st || !fullName(S.bishopric[i])) continue;
    if (!gmap[st]) { gmap[st] = { st: st, who: [] }; groups.push(gmap[st]); }
    gmap[st].who.push(S.bishopric[i]);
  }
  for (i = 0; i < groups.length; i++) for (j = 0; j < groups[i].who.length; j++) {
    var runs = ordinalRuns(withRole(groups[i].who[j]));
    if (j === 0) bl.push(labelLine(groups[i].st, runs, clone(LP)));
    else bl.push(P(runs, { ind: { left: 2520, firstLine: 360 } }));
  }
  bl.push(P([], { st: 'ListParagraph' }));
  var chor = trim(W.chorister) || fullName(S.chorister);
  var shdLP = { st: 'ListParagraph', num: [8, 0], shd: true };

  f.appendChild(card('Ward', field('Ward name', txt(S, 'ward')), field('Sheet title', txt(S, 'headerTitle'))));
  f.appendChild(peopleEditor('Bishopric (in order: Bishop, 1st, 2nd)', S.bishopric, true));
  f.appendChild(peopleEditor('Stake Presidency', S.stakePresidency, true));
  f.appendChild(card('Music', h('div', { class: 'grid3' }, txt(S.organist, 'title', 'Title'), txt(S.organist, 'name', 'Organist'), h('span'), h('span')),
    h('div', { class: 'grid3' }, txt(S.chorister, 'title', 'Title'), txt(S.chorister, 'name', 'Default chorister'), h('span'), h('span'))));
  var hy = h('textarea', { rows: 10, oninput: function () { S.hymns = parseHymns(this.value); saveSettings(); schedulePreview(); } }, hymnsToText(S.hymns));
  f.appendChild(card('Hymn list', h('div', { class: 'hint' }, 'One hymn per line: number, a vertical bar, then the title (for example  1017|This Is the Christ). Paste as many as you like; 1000+ numbers work.'), hy));
  var lay = card('Layout',
    h('label', { class: 'cb' }, h('input', { type: 'checkbox', checked: S.pageBreaks, onchange: function () { S.pageBreaks = this.checked; saveSettings(); schedulePreview(); } }), 'Start new pages where the master sheet does (before Ward Business, Ward Releases and Sacrament)'),
    field('Minimum rows', h('input', { type: 'number', min: '1', max: '12', value: S.releaseRows, oninput: function () { S.releaseRows = Math.max(1, +this.value || 1); saveSettings(); schedulePreview(); } })),
    h('div', { class: 'hint' }, 'Releases and Sustainings tables always have at least this many rows, with empty ones left to write in by hand.'));
  f.appendChild(lay);
  var tc = card('Scripted text (printed exactly as shown)');
  Object.keys(TEXT_LABELS).forEach(function (k) {
    tc.appendChild(h('div', { class: 'field', style: 'align-items:flex-start' }, h('label', { style: 'width:150px' }, TEXT_LABELS[k]),
      h('div', { class: 'in' }, h('textarea', { rows: S.text[k].length > 90 ? 3 : 1, oninput: function () { S.text[k] = this.value; saveSettings(); schedulePreview(); } }, S.text[k]))));
  });
  f.appendChild(tc);
  return f;
}
var settingsTimer;
document.addEventListener('input', function (e) { if (tab === 'settings') { clearTimeout(settingsTimer); settingsTimer = setTimeout(saveSettings, 400); } });

function refreshWeek() {
  if (!confirm('Refresh this week to a blank sheet?\n\nEverything typed for ' + (SG.dateLabel(W.date) || 'this week') + ' is cleared (names, announcements, hymns, program, picture). Your Settings and other saved weeks are not changed.')) return;
  W = SG.newWeek(W.date); banner = ''; tab = 'week'; changed(); render();
}

/* ---------- shell ---------- */
var mq = window.matchMedia ? window.matchMedia('(max-width: 800px)') : { matches: false }, mview = 'form';
function isMobile() { return !!mq.matches; }
function render() {
  var scrollY = window.scrollY, m = isMobile();
  $app.innerHTML = '';
  var acts = h('span', { class: 'actions' },
    btn('Refresh', refreshWeek), btn(m ? 'Save Final' : 'Save as Final', saveFinal), btn(m ? 'Print' : 'Print / PDF', printIt), btn(m ? '.docx' : 'Download .docx', download, 'pri'));
  var top = h('header', { class: 'top' }, h('h1', null, 'Sacrament Guide'),
    h('span', { class: 'tabs' },
      ['week:This week', 'history:History', 'settings:Settings'].map(function (t) {
        var p = t.split(':'); return h('button', { class: tab === p[0] ? 'on' : '', onclick: function () { saveWeek(); tab = p[0]; (p[0] === 'history' ? refreshHistory() : Promise.resolve()).then(render); } }, p[1]);
      })),
    h('span', { class: 'spacer' }), acts);
  $app.appendChild(top);
  if (tab === 'week') {
    var seg = h('div', { class: 'seg' },
      h('button', { class: mview === 'form' ? 'on' : '', onclick: function () { mview = 'form'; render(); } }, 'Form'),
      h('button', { class: mview === 'preview' ? 'on' : '', onclick: function () { mview = 'preview'; render(); } }, 'Preview'));
    var wrap = h('div', { class: 'wrap', 'data-view': mview }, h('div', { class: 'formcol' }, weekForm()), h('div', { class: 'preview' }, h('iframe', { id: 'pv', title: 'Live preview' })));
    $app.appendChild(seg); $app.appendChild(wrap); updatePreview();
  } else {
    $app.appendChild(h('div', { class: 'wrap one' }, h('div', null, tab === 'history' ? historyView() : settingsView())));
  }
  window.scrollTo(0, scrollY);
}
if (mq.addEventListener) mq.addEventListener('change', function () { if (W) render(); });

/* ---------- start ---------- */
Store.open().then(function () { return Store.get('settings'); }).then(function (s) {
  if (s) S = mergeSettings(s);
  return refreshHistory();
}).then(function () { return loadWeek(nextSunday()); }).then(render);
window.addEventListener('beforeunload', function () { saveWeek(); });
if (SG.isPublic && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
})();
</script>
</body></html>
